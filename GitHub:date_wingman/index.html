<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dating HQ CRM</title>
  <meta name="theme-color" content="#15171c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dating HQ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="logo">♥</div><div><strong>Dating HQ</strong><small>CRM v4</small></div></div>
      <nav>
        <button class="nav active" data-view="dashboard">Dashboard</button>
        <button class="nav" data-view="profiles">Profiles</button>
        <button class="nav" data-view="pipeline">Pipeline</button>
        <button class="nav" data-view="actions">Today</button>
        <button class="nav" data-view="templates">Templates</button>
        <button class="nav" data-view="settings">Settings</button>
      </nav>
      <div class="side-actions">
        <button id="exportBtn">Export</button>
        <label>Import<input id="importInput" type="file" accept="application/json" hidden></label>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div><h1 id="title">Dashboard</h1><p id="subtitle">What needs your attention now.</p></div>
        <div class="top-actions">
          <input id="search" type="search" placeholder="Search profiles">
          <button id="addBtn" class="primary">+ Add</button>
        </div>
      </header>

      <section id="dashboard" class="view active"></section>
      <section id="profiles" class="view"></section>
      <section id="pipeline" class="view"></section>
      <section id="actions" class="view"></section>
      <section id="templates" class="view"></section>
      <section id="settings" class="view"></section>
    </main>
  </div>

  <dialog id="profileDialog">
    <form id="profileForm">
      <div class="dialog-head"><h2 id="dialogTitle">Profile</h2><button type="button" id="closeProfile">×</button></div>
      <input type="hidden" id="profileId">
      <div class="hero-editor">
        <div id="coverPreview" class="cover-preview"><span>Cover photo</span></div>
        <div class="stack">
          <label class="primary upload">Choose cover<input id="coverInput" type="file" accept="image/*" hidden></label>
          <label class="secondary upload">Add attachments<input id="attachmentsInput" type="file" accept="image/*" multiple hidden></label>
          <button type="button" id="removeCover" class="secondary">Remove cover</button>
        </div>
      </div>

      <div class="form-grid">
        <label>Name<input id="name" required></label>
        <label>Age<input id="age" type="number" min="18" max="99"></label>
        <label>Platform<select id="platform"><option>Tinder</option><option>Bumble</option><option>Hinge</option><option>WhatsApp</option><option>Instagram</option><option>Other</option></select></label>
        <label>Location<input id="location"></label>
        <label>Status<select id="status"><option>Hot</option><option>Active</option><option>Waiting</option><option>Dormant</option><option>Archived</option></select></label>
        <label>Priority<select id="priority"><option>A+</option><option>A</option><option>B+</option><option>B</option><option>C</option></select></label>
        <label>Stage<select id="stage"><option>New Match</option><option>Messaging</option><option>WhatsApp</option><option>Video Call</option><option>Coffee Planned</option><option>Dinner Planned</option><option>Met</option><option>Relationship Potential</option></select></label>
        <label>Warmth<select id="warmth"><option>High</option><option>Medium</option><option>Low</option></select></label>
        <label>Travel relevance<select id="travel"><option>None</option><option>Current city</option><option>Upcoming trip</option><option>Long distance</option></select></label>
        <label>Follow-up<input id="followUp" type="date"></label>
      </div>

      <label>Last message<textarea id="lastMessage" rows="3"></textarea></label>
      <label>Next move<textarea id="nextMove" rows="3"></textarea></label>
      <label>Notes<textarea id="notes" rows="4"></textarea></label>

      <div class="subhead"><h3>Timeline</h3><button type="button" id="addTimeline" class="secondary">+ Event</button></div>
      <div id="timelineEditor" class="timeline-editor"></div>

      <div class="subhead"><h3>Attachments</h3></div>
      <div id="attachmentsPreview" class="attachments"></div>

      <div class="dialog-actions"><button type="button" id="cancelProfile" class="secondary">Cancel</button><button type="submit" class="primary">Save</button></div>
    </form>
  </dialog>

  <dialog id="timelineDialog">
    <form id="timelineForm">
      <div class="dialog-head"><h2>Add timeline event</h2><button type="button" id="closeTimeline">×</button></div>
      <label>Date<input id="eventDate" type="date" required></label>
      <label>Type<select id="eventType"><option>Matched</option><option>Message</option><option>Moved to WhatsApp</option><option>Call</option><option>Date planned</option><option>Met</option><option>Note</option></select></label>
      <label>Details<textarea id="eventDetails" rows="4" required></textarea></label>
      <div class="dialog-actions"><button type="button" id="cancelTimeline" class="secondary">Cancel</button><button class="primary">Add</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
  </script>
</body>
</html>
